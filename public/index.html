<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄知识大乱斗</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
    min-height:100vh;color:#fff;
    padding:16px;
  }
  .wrap{max-width:720px;margin:0 auto}
  h1{
    text-align:center;font-size:30px;margin-bottom:16px;
    background:linear-gradient(90deg,#ffd700,#ff6b6b,#ffd700);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:titleGlow 2.5s ease-in-out infinite;
  }
  @keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,215,0,.3))}50%{filter:drop-shadow(0 0 16px rgba(255,215,0,.7))}}
  .panel{
    background:rgba(255,255,255,.05);border-radius:20px;padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
  }
  .hidden{display:none!important}
  .gold{color:#ffd700}
  /* ---- 通用按钮 ---- */
  .btn{
    padding:12px 40px;font-size:16px;border:none;border-radius:25px;cursor:pointer;
    background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;font-weight:bold;
    transition:all .3s;
  }
  .btn:hover{transform:scale(1.05);box-shadow:0 5px 20px rgba(238,90,36,.5)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.green{background:linear-gradient(135deg,#2ecc71,#27ae60)}
  .btn.large{width:100%;padding:14px}
  .link-btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;
    border-radius:20px;padding:8px 16px;cursor:pointer;font-size:14px;transition:all .3s;
  }
  .link-btn:hover{background:rgba(255,215,0,.15);border-color:#ffd700}
  input[type=text]{
    width:100%;padding:12px;margin:10px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.3);color:#fff;font-size:15px;text-align:center;outline:none;
  }
  /* ---- 加入页 ---- */
  .avatar-upload{
    width:90px;height:90px;margin:8px auto;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;
    transition:all .3s;position:relative;
  }
  .avatar-upload:hover{border-color:#ffd700;background:rgba(255,215,0,.1)}
  .avatar-upload img{width:100%;height:100%;object-fit:cover}
  .hint-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#aaa;font-size:13px}
  /* ---- 队伍预览（主持人大厅） ---- */
  .teams-preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .team-prev{flex:1;min-width:80px;background:rgba(255,255,255,.05);border:2px solid;border-radius:12px;padding:8px;text-align:center;animation:pop .4s}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .team-prev .cnt{font-size:12px;color:#ccc}
  .player-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .player-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 12px;font-size:13px;animation:pop .3s}
  .player-chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
  .room-code{text-align:center;color:#aaa;font-size:12px;margin-bottom:6px}
  .qr-caption{text-align:center;color:#aaa;font-size:12px;margin-top:6px}
  /* ---- 学生等待大厅 ---- */
  .waiting-spinner{width:42px;height:42px;margin:8px auto;border:4px solid rgba(255,215,0,.2);border-top-color:#ffd700;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .my-team{border:2px solid #888;border-radius:16px;padding:14px;margin-top:12px;background:rgba(0,0,0,.2)}
  .team-tag{font-weight:bold;font-size:18px}
  /* ---- 队伍血条条（学生作答顶部） ---- */
  .team-strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
  .mini-team{flex:1;min-width:120px;background:rgba(0,0,0,.25);border:2px solid;border-radius:12px;padding:6px 8px;text-align:center;position:relative;transition:.3s}
  .mini-team.dying{opacity:.5;filter:grayscale(.7)}
  .mini-team .mt-name{font-size:13px;font-weight:bold}
  .mini-team .mt-hp{height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;margin-top:4px}
  .mini-team .mt-hp i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#27ae60);transition:width .6s ease}
  .mini-team.shake{animation:shake .5s}
  /* ---- 题目与选项 ---- */
  .question-box{background:rgba(0,0,0,.35);border-radius:16px;padding:18px;margin-top:10px;border:1px solid rgba(255,255,255,.08)}
  .question-num{font-size:13px;color:#ffd700;margin-bottom:10px}
  .question-text{font-size:18px;line-height:1.6;margin-bottom:14px;min-height:48px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .option-btn{
    padding:14px;border:2px solid rgba(255,255,255,.2);border-radius:12px;
    background:rgba(255,255,255,.08);color:#fff;font-size:15px;cursor:pointer;
    transition:all .2s;text-align:left;position:relative;
  }
  .option-btn:hover:not(:disabled){border-color:#ffd700;background:rgba(255,215,0,.15);transform:translateY(-2px)}
  .option-btn.locked{opacity:.6;cursor:not-allowed}
  .option-btn.chosen{border-color:#ffd700;background:rgba(255,215,0,.2);box-shadow:0 0 14px rgba(255,215,0,.4)}
  .option-btn.correct{border-color:#2ecc71;background:rgba(46,204,113,.35);animation:correctPop .5s}
  .option-btn.wrong{border-color:#e74c3c;background:rgba(231,76,60,.35);animation:shake .5s}
  @keyframes correctPop{0%{transform:scale(.85)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  /* ---- 倒计时 ---- */
  .cd-wrap{position:relative;height:14px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;margin-top:12px}
  .cd-bar{height:100%;background:linear-gradient(90deg,#ffd700,#ff6b6b);width:100%;border-radius:8px;transition:width .1s linear}
  .cd-bar.warn{animation:blink .5s infinite}
  @keyframes blink{50%{opacity:.4}}
  .cd-num{position:absolute;right:8px;top:-14px;font-size:14px;font-weight:bold;color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,.6)}
  /* ---- 揭晓 ---- */
  .reveal{display:none;margin-top:14px;padding:14px;border-radius:12px;font-size:14px;line-height:1.6;animation:pop .4s}
  .reveal.right{background:rgba(46,204,113,.15);border-left:4px solid #2ecc71}
  .reveal.wrong{background:rgba(231,76,60,.15);border-left:4px solid #e74c3c}
  .reveal.show{display:block}
  /* ---- 主持人战斗大屏 ---- */
  #hostBattlePanel{max-width:900px;margin:0 auto}
  .host-arena{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0;position:relative}
  .host-team{
    background:rgba(255,255,255,.06);border-radius:16px;padding:12px;text-align:center;
    border:2px solid;transition:.3s;position:relative;
  }
  .host-team.dead{opacity:.35;filter:grayscale(.8)}
  .host-team.attacker{animation:charge .6s}
  .host-team.hit{animation:hit .6s}
  @keyframes charge{0%,100%{transform:scale(1)}40%{transform:scale(1.12) translateY(-6px)}}
  @keyframes hit{0%,100%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.08);filter:brightness(1.8) sepia(1)}}
  .host-team .big-emoji{font-size:52px;display:block;margin-bottom:4px}
  .host-team .ht-name{font-weight:bold;font-size:14px}
  .host-hp{height:16px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;margin-top:6px;position:relative}
  .host-hp i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#27ae60);transition:width .6s ease}
  .host-hp span{position:absolute;inset:0;font-size:10px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  .host-members{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  .host-members img,.host-members .mini-av{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#333;font-size:12px;display:flex;align-items:center;justify-content:center}
  .host-qbox{background:rgba(0,0,0,.35);border-radius:16px;padding:16px;margin-top:10px;border:1px solid rgba(255,255,255,.08)}
  .host-qbox .answered{font-size:13px;color:#aaa}
  .host-log{background:rgba(0,0,0,.3);border-radius:12px;padding:10px;height:130px;overflow-y:auto;font-size:13px;line-height:1.8;margin-top:10px}
  /* ---- 结算 ---- */
  .rank-item{display:flex;align-items:center;gap:12px;padding:12px;margin:6px 0;background:rgba(255,255,255,.06);border-radius:12px;border-left:4px solid #555;animation:pop .4s}
  .rank-item.r1{border-left-color:#ffd700;background:linear-gradient(90deg,rgba(255,215,0,.18),transparent)}
  .rank-item.r2{border-left-color:#c0c0c0}
  .rank-item.r3{border-left-color:#cd7f32}
  .rank-medal{font-size:26px}
  .rank-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;background:#444;border:2px solid rgba(255,255,255,.2)}
  .rank-avatar img{width:100%;height:100%;object-fit:cover}
  .rank-info{flex:1}
  .rank-info .rn{font-weight:bold}
  .rank-info .rd{font-size:12px;color:#999}
  .rank-score{font-size:18px;font-weight:bold;color:#ffd700}
  .champion{text-align:center;font-size:26px;margin:8px 0;color:#ffd700;animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .stat-block{background:rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-top:14px}
  .stat-block b{color:#ffd700;display:block;margin-bottom:8px}
  .stat-none{color:#999;font-size:13px;padding:6px 0}
  .stat-item{border-left:3px solid #e74c3c;background:rgba(231,76,60,.08);border-radius:8px;padding:8px 12px;margin:6px 0}
  .stat-q{font-size:13px;color:#eee;font-weight:bold}
  .stat-t{font-size:13px;color:#bbb;margin:3px 0}
  .stat-opts{display:flex;gap:6px;flex-wrap:wrap}
  .stat-opt{font-size:11px;background:#e74c3c;color:#fff;border-radius:20px;padding:2px 9px}
  /* ---- 飘字 / 技能飞行 / 彩带 ---- */
  .fly-emoji{position:absolute;font-size:40px;pointer-events:none;z-index:30;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
  .dmg-num{position:absolute;font-size:22px;font-weight:bold;color:#ff6b6b;pointer-events:none;z-index:31;text-shadow:0 0 8px rgba(0,0,0,.8);animation:dmgFloat 1s forwards}
  @keyframes dmgFloat{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.4)}}
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .vs-badge{text-align:center;font-size:16px;color:#ffd700;margin:4px 0}
  @media(max-width:500px){.options{grid-template-columns:1fr}.wrap{max-width:100%}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 学生加入页 ===== -->
  <div id="joinPanel">
    <h1>⚔️ 英雄知识大乱斗 ⚔️</h1>
    <div class="panel" style="text-align:center">
      <p style="margin-bottom:12px;color:#aaa">👋 上传头像、输入昵称即可加入战斗，系统会自动为你分配队伍</p>
      <div class="avatar-upload" onclick="document.getElementById('fileInput').click()">
        <span id="avatarIcon">🪖</span>
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <input type="text" id="studentName" placeholder="输入你的昵称" maxlength="12">
      <button class="btn green large" id="joinBtn" onclick="joinRoom()" disabled>⚔️ 加入战斗！</button>
    </div>
    <div class="hint-bar">
      <span>正在等待主持人开始游戏</span>
      <button class="link-btn" onclick="goHost()">🎮 主持人大屏</button>
    </div>
  </div>

  <!-- ===== 主持人大厅 ===== -->
  <div class="panel hidden" id="hostPanel" style="max-width:600px;margin:20px auto">
    <h2 style="text-align:center;color:#ffd700;margin-bottom:6px">🏠 主持人大屏</h2>
    <p style="text-align:center;font-size:14px;color:#aaa;margin-bottom:10px">学生扫下方二维码即可加入，无需房间号</p>
    <div class="room-code">加入二维码</div>
    <div style="display:flex;justify-content:center"><div id="hostQrBox"></div></div>
    <div class="qr-caption">用手机微信/浏览器扫码，上传头像昵称后自动分组</div>
    <h3 style="margin:12px 0 6px">已加入玩家（<span id="playerCount">0</span>）</h3>
    <div class="teams-preview" id="teamsPreview"></div>
    <div class="player-list" id="hostPlayerList"></div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn green large" id="startGameBtn" onclick="startGame()" disabled>⚔️ 开始战斗！</button>
    </div>
  </div>

  <!-- ===== 学生等待大厅 ===== -->
  <div class="panel hidden" id="lobbyPanel" style="max-width:400px;margin:20px auto;text-align:center">
    <div class="waiting-spinner"></div>
    <h3>等待主持人开始游戏...</h3>
    <div class="my-team" id="myTeamBox">
      <span class="team-tag" id="myTeamName">我的队伍</span>
      <div style="font-size:12px;color:#ccc;margin-top:6px" id="myTeamSkill"></div>
      <div class="player-list" id="myTeamMembers" style="margin-top:8px"></div>
    </div>
    <p style="color:#aaa;font-size:13px;margin-top:8px">系统已自动为你分配队伍</p>
  </div>

  <!-- ===== 学生作答（同时作答） ===== -->
  <div class="hidden" id="answerPanel">
    <div class="panel">
      <div class="team-strip" id="teamStrip"></div>
      <div class="question-box">
        <div class="question-num" id="qNum">第 1 题</div>
        <div class="question-text" id="qText">加载中...</div>
        <div class="options" id="optsBox"></div>
        <div class="cd-wrap"><div class="cd-bar" id="cdBar"></div></div>
        <div class="cd-num" id="cdNum"></div>
        <div class="reveal" id="revealBox"></div>
      </div>
    </div>
  </div>

  <!-- ===== 主持人战斗大屏 ===== -->
  <div class="hidden" id="hostBattlePanel" style="max-width:900px;margin:0 auto">
    <h1 style="font-size:22px">⚔️ 战场实况 ⚔️</h1>
    <div class="host-arena" id="hostArena"></div>
    <div class="host-qbox">
      <div class="question-num" id="hqNum">第 1 题</div>
      <div class="question-text" id="hqText">等待出题...</div>
      <div class="answered" id="hAnswered">已作答 0 人</div>
      <div class="cd-wrap"><div class="cd-bar" id="hcdBar"></div></div>
      <div class="cd-num" id="hcdNum"></div>
    </div>
    <div class="host-log" id="hostLog"></div>
  </div>

  <!-- ===== 结算 ===== -->
  <div class="panel hidden" id="resultPanel" style="max-width:520px;margin:20px auto">
    <h2 style="text-align:center;font-size:24px;margin-bottom:6px">🏆 最终排名</h2>
    <div class="champion" id="championText"></div>
    <div id="finalRanks"></div>
    <div id="statsSection" style="display:none"></div>
    <div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center">
      <button class="btn green" id="replayBtn" onclick="replay()">🔄 再来一局</button>
      <button class="btn" onclick="location.reload()">返回首页</button>
    </div>
  </div>

  <!-- ===== 特效层 ===== -->
  <div id="fxOverlay" style="position:absolute;inset:0;pointer-events:none;z-index:20"></div>
</div>

<script>
// ===== 全局状态 =====
const HOST_PASSWORD = '666';
let ws = null;
let isHost = false;
let myPlayerId = null;
let myTeam = null;
let myPhoto = null;
let cdTimer = null;
let cdEnd = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => console.log('connected');
  ws.onmessage = (e) => { try { handleMsg(JSON.parse(e.data)); } catch(err){} };
  ws.onclose = () => { setTimeout(connect, 1500); };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function show(id) {
  ['joinPanel','hostPanel','lobbyPanel','answerPanel','hostBattlePanel','resultPanel'].forEach(p => {
    const el = document.getElementById(p);
    if (p === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
}

// ===== 加入 =====
document.getElementById('fileInput').addEventListener('change', function(){
  const f = this.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    myPhoto = r.result;
    const box = document.querySelector('.avatar-upload');
    box.innerHTML = `<img src="${myPhoto}">`;
    document.getElementById('joinBtn').disabled = false;
  };
  r.readAsDataURL(f);
});
document.getElementById('studentName').addEventListener('input', function(){
  document.getElementById('joinBtn').disabled = !(this.value.trim() && (myPhoto || true));
});
function joinRoom() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) return;
  send({ type:'join', name, photo: myPhoto });
}

// ===== 主持人 =====
function goHost() {
  const pw = (prompt('请输入主持人密码：') || '').trim();
  if (pw === '') return;
  if (pw !== HOST_PASSWORD) { alert('❌ 密码错误，无法进入主持人模式'); return; }
  isHost = true;
  send({ type:'host_init', password: pw });
  renderQr();
  show('hostPanel');
}
function startGame() { send({ type:'start_game' }); }
function replay() { if (isHost) send({ type:'reset_game' }); }

function renderQr() {
  const joinUrl = location.origin;
  const box = document.getElementById('hostQrBox');
  box.innerHTML = '';
  QRCode.toCanvas(document.createElement('canvas'), joinUrl, { width:180, margin:1 }, (err,c)=>{
    if (!err) box.appendChild(c);
  });
}
document.addEventListener('visibilitychange', ()=>{ if (isHost) renderQr(); });

// ===== 倒计时 =====
function startCountdown(seconds, barId, numId) {
  stopCountdown();
  cdEnd = Date.now() + seconds * 1000;
  cdTimer = setInterval(() => {
    const remain = Math.max(0, (cdEnd - Date.now()) / 1000);
    const bar = document.getElementById(barId), num = document.getElementById(numId);
    if (bar) { bar.style.width = (remain / seconds * 100) + '%'; bar.classList.toggle('warn', remain <= 5); }
    if (num) num.textContent = Math.ceil(remain);
    if (remain <= 0) { stopCountdown(); if (num) num.textContent = '时间到'; }
  }, 100);
}
function stopCountdown() { if (cdTimer) clearInterval(cdTimer); cdTimer = null; }

// ===== 队伍血条条（学生作答顶部）=====
function renderTeamStrip(teams) {
  const box = document.getElementById('teamStrip');
  box.innerHTML = (teams || []).map(t => `
    <div class="mini-team" data-team="${t.idx}" style="border-color:${t.color}" data-hp="${t.hp}">
      <div class="mt-name" style="color:${t.color}">${t.name} ${t.emoji||''}</div>
      <div class="mt-hp"><i style="width:${Math.max(0,t.hp/300*100)}%;background:${t.color}"></i></div>
    </div>`).join('');
}

// ===== 消息处理 =====
function handleMsg(msg) {
  switch (msg.type) {
    case 'host_rejected':
      isHost = false; show('joinPanel'); alert(msg.msg || '密码错误'); break;

    case 'lobby_update': {
      if (isHost) {
        document.getElementById('playerCount').textContent = msg.players.length;
        document.getElementById('hostPlayerList').innerHTML = msg.players.map(p =>
          `<div class="player-chip">${p.photo?`<img src="${p.photo}">`:''} ${esc(p.name)}</div>`).join('');
        document.getElementById('teamsPreview').innerHTML = (msg.teams || []).map(t =>
          `<div class="team-prev" style="border-color:${t.color}"><b style="color:${t.color}">${t.name}</b><div class="cnt">${t.members.length} 人</div></div>`).join('');
        document.getElementById('startGameBtn').disabled = msg.phase !== 'lobby';
        document.getElementById('startGameBtn').textContent = msg.phase === 'lobby' ? '⚔️ 开始战斗！' : '游戏中';
      }
      if (!isHost && myPlayerId) {
        const my = msg.players.find(p => p.id === myPlayerId);
        const team = (msg.teams || []).find(t => t.idx === my?.teamIdx);
        if (team && myTeam !== team.name) {
          myTeam = { name: team.name, color: team.color, skill: team.skill, emoji: team.skill.emoji };
          document.getElementById('myTeamName').textContent = team.name;
          document.getElementById('myTeamName').style.color = team.color;
          document.getElementById('myTeamBox').style.borderColor = team.color;
          document.getElementById('myTeamSkill').textContent = `队伍技能: ${team.skill.emoji} ${team.skill.name}`;
          document.getElementById('myTeamMembers').innerHTML = team.members.map(m =>
            `<div class="player-chip" style="border:1px solid ${team.color}">${m.photo?`<img src="${m.photo}">`:''} ${esc(m.name)}</div>`).join('');
        }
      }
      break;
    }

    case 'joined':
      myPlayerId = msg.playerId;
      myTeam = msg.team;
      document.getElementById('myTeamName').textContent = msg.team.name;
      document.getElementById('myTeamName').style.color = msg.team.color;
      document.getElementById('myTeamBox').style.borderColor = msg.team.color;
      document.getElementById('myTeamSkill').textContent = `队伍技能: ${msg.team.skill.emoji} ${msg.team.skill.name}`;
      show('lobbyPanel');
      break;

    case 'game_started':
      if (isHost) show('hostBattlePanel');
      break;

    // ===== 同步作答回合：全员同一题 =====
    case 'round_question':
      if (!isHost) showQuestion(msg);
      else { show('hostBattlePanel'); renderHostQuestion(msg); }
      break;

    case 'round_result':
      if (!isHost) revealRound(msg);
      else renderHostResolve(msg);
      break;

    case 'strategy_prompt':
      if (!isHost) showStrategy(msg);
      break;

    case 'strategy_waiting':
      if (!isHost) waitingStrategy(msg);
      break;

    case 'strategy_result':
      if (!isHost) strategyDone(msg);
      break;

    case 'shield_up':
      if (isHost) shieldFx(msg);
      break;

    case 'state_update':
      if (isHost) renderHostState(msg);
      break;

    case 'game_end':
      showResult(msg);
      break;

    case 'answer_stats':
      if (isHost) renderStats(msg.stats);
      break;

    case 'game_reset':
      stopCountdown();
      if (isHost) show('hostPanel');
      else show('lobbyPanel');
      break;
  }
}

// ===== 学生作答 =====
function showQuestion(msg) {
  show('answerPanel');
  stopCountdown();
  document.getElementById('qNum').textContent = `第 ${msg.qNum} 题`;
  document.getElementById('qText').textContent = msg.question;
  const box = document.getElementById('optsBox');
  box.innerHTML = '';
  msg.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    b.dataset.idx = i;
    b.onclick = () => { if (b.classList.contains('locked')) return; lockIn(i, box); };
    box.appendChild(b);
  });
  document.getElementById('revealBox').className = 'reveal';
  document.getElementById('revealBox').innerHTML = '';
  renderTeamStrip([]);
  startCountdown(msg.roundTime, 'cdBar', 'cdNum');
}
function lockIn(idx, box) {
  box.querySelectorAll('.option-btn').forEach(b => b.classList.add('locked'));
  box.querySelectorAll('.option-btn')[idx].classList.add('chosen');
  send({ type:'answer', choice: box.querySelectorAll('.option-btn')[idx].textContent.slice(3).trim() });
}
function revealRound(msg) {
  stopCountdown();
  // 队伍血条更新
  const strip = document.getElementById('teamStrip');
  strip.innerHTML = (msg.teams || []).map(t =>
    `<div class="mini-team ${t.alive?'':'dying'}" style="border-color:${t.color}">
      <div class="mt-name" style="color:${t.color}">${t.name}</div>
      <div class="mt-hp"><i style="width:${Math.max(0,t.hp/300*100)}%;background:${t.color}"></i></div>
    </div>`).join('');
  // 高亮正确/错误选项
  const btns = document.querySelectorAll('#optsBox .option-btn');
  btns.forEach(b => {
    if (b.textContent.slice(3).trim() === msg.answer) b.classList.add('correct');
    else if (parseInt(b.dataset.idx) === msg.choiceIdx) b.classList.add('wrong');
  });
  // 揭晓
  const rb = document.getElementById('revealBox');
  rb.className = 'reveal ' + (msg.correct ? 'right show' : 'wrong show');
  let txt = msg.correct ? `✅ 答对了！` : `❌ 答错了！正确答案：<b>${msg.answer}</b>`;
  txt += `<br>${msg.explain}`;
  // 我所在队伍的战斗事件
  if (msg.events && msg.events.length) {
    const myIdx = myTeam ? null : null;
    const myEvent = msg.events.find(e => e.toTeam === myTeam?.idx || e.fromTeam === myTeam?.idx);
    const iAm = (myTeam && msg.teams && msg.teams.find(t => t.name === myTeam.name));
    if (iAm) {
      const involved = msg.events.filter(e => e.fromTeam === iAm.idx || e.toTeam === iAm.idx);
      if (involved.length) {
        const last = involved[involved.length - 1];
        if (last.fromTeam === iAm.idx) txt += `<br>🔥 你的队伍释放技能，攻击了 <b style="color:${last.toColor}">${last.toName}</b>（-${last.damage} HP）`;
        else txt += `<br>💥 你的队伍被 <b style="color:${last.fromColor}">${last.fromName}</b> 攻击，受到 ${last.damage} 伤害`;
      }
    }
  }
  rb.innerHTML = txt;
  // 我的队伍受击抖动
  if (msg.teams && myTeam) {
    const myEl = document.querySelector(`.mini-team[data-team]`) ;
    const idx = msg.teams.findIndex(t => t.name === myTeam.name);
    if (idx >= 0) {
      const el = document.querySelectorAll('.mini-team')[idx];
      if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    }
  }
}

// ===== 先手权（答得快且正确率高 → 进攻或防御）=====
let pendingStrategy = null;
function showStrategy(msg) {
  show('answerPanel');
  pendingStrategy = msg;
  const rb = document.getElementById('revealBox');
  rb.className = 'reveal show';
  rb.style.borderLeft = '4px solid #f1c40f';
  rb.style.background = 'rgba(241,196,15,.12)';
  rb.innerHTML = `
    <div style="font-weight:bold;color:#ffd700">🎯 先手权！你们的队伍答得又快又准</div>
    <div style="font-size:13px;color:#ccc;margin:6px 0">选择进攻敌方，或防御本队抵挡下一波攻击</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" onclick="vote('attack')">🗡️ 进攻</button>
      <button class="btn green" onclick="vote('defend')">🛡️ 防御本队</button>
    </div>
    <div id="targetPick" style="display:none;margin-top:10px">
      <div style="font-size:13px;color:#ccc;margin-bottom:6px">选择要进攻的敌方队伍：</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="targetBtns"></div>
    </div>`;
}
function vote(action) {
  if (!pendingStrategy) return;
  const rb = document.getElementById('revealBox');
  if (action === 'defend') {
    send({ type: 'strategy', action: 'defend' });
    rb.innerHTML = '<div style="color:#2ecc71">🛡️ 已提交：防御本队</div>';
    return;
  }
  document.getElementById('targetPick').style.display = 'block';
  const box = document.getElementById('targetBtns');
  box.innerHTML = '';
  (pendingStrategy.enemies || []).forEach(e => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.style.background = 'linear-gradient(135deg,' + e.color + ',#333)';
    b.textContent = '⚔️ ' + e.name;
    b.onclick = () => {
      send({ type: 'strategy', action: 'attack', targetIdx: e.idx });
      rb.innerHTML = '<div style="color:#ff6b6b">🗡️ 已提交：进攻 ' + esc(e.name) + '</div>';
    };
    box.appendChild(b);
  });
}
function waitingStrategy(msg) {
  show('answerPanel');
  const rb = document.getElementById('revealBox');
  rb.className = 'reveal show';
  rb.style.borderLeft = '4px solid #f1c40f';
  rb.style.background = 'rgba(0,0,0,.3)';
  rb.innerHTML = `<div style="font-size:14px">⏳ 等待 <b style="color:#ffd700">${esc(msg.teamName)}</b> 选择进攻或防御...</div>`;
}
function strategyDone(msg) {
  const rb = document.getElementById('revealBox');
  if (msg.action === 'defend') {
    rb.innerHTML = `<div style="font-size:14px">🛡️ 你的队伍选择<b>防御</b>，护盾可减免 <b style="color:#2ecc71">${msg.reduction}%</b> 的下一次伤害</div>`;
  } else {
    rb.innerHTML = `<div style="font-size:14px">🗡️ 你的队伍进攻了 <b style="color:#ff6b6b">${esc(msg.targetName)}</b>，造成 ${msg.damage} 伤害</div>`;
  }
}

// ===== 主持人：题目与战场 =====
function renderHostQuestion(msg) {
  document.getElementById('hqNum').textContent = `第 ${msg.qNum} 题`;
  document.getElementById('hqText').textContent = msg.question;
  document.getElementById('hAnswered').textContent = '正在作答...';
  startCountdown(msg.roundTime, 'hcdBar', 'hcdNum');
}
function renderHostState(s) {
  if (s.phase === 'lobby') { show('hostPanel'); return; }
  if (s.phase === 'ended') return;
  show('hostBattlePanel');
  const row = document.getElementById('hostArena');
  row.innerHTML = (s.teams || []).map((t, i) =>
    `<div class="host-team ${t.alive?'':'dead'}" data-team="${t.idx}" style="border-color:${t.color}">
      <span class="big-emoji">${t.skill.emoji}${t.shield?` <span class="shield-badge" style="font-size:22px" title="护盾减免${t.shield}%">🛡️</span>`:''}</span>
      <div class="ht-name" style="color:${t.color}">${t.name}</div>
      <div class="host-hp"><i style="width:${Math.max(0,t.hp/300*100)}%;background:${t.color}"></i><span>${t.hp}</span></div>
      <div class="host-members">${t.members.map(m=>m.photo?`<img src="${m.photo}" title="${esc(m.name)}">`:`<span class="mini-av" title="${esc(m.name)}">${m.skill?m.skill.emoji:'?'}</span>`).join('')}</div>
    </div>`).join('');
  if (s.currentQuestion) {
    document.getElementById('hqNum').textContent = `第 ${s.currentQuestion.qNum} 题`;
    document.getElementById('hqText').textContent = s.currentQuestion.q;
    document.getElementById('hAnswered').textContent = `已作答 ${s.answered} 人`;
  }
  renderHostLog(s.log);
}
function shieldFx(msg) {
  const row = document.getElementById('hostArena');
  const el = row.querySelector(`.host-team[data-team="${msg.teamIdx}"]`);
  if (el) {
    // 在队伍上方浮现护盾
    const arena = document.getElementById('hostArena');
    const ar = arena.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const s = document.createElement('div');
    s.style.position = 'absolute'; s.style.fontSize = '40px'; s.style.zIndex = '30';
    s.style.left = (r.left - ar.left + r.width / 2 - 20) + 'px';
    s.style.top = (r.top - ar.top - 30) + 'px';
    s.textContent = '🛡️';
    s.style.animation = 'bounce 1s infinite';
    arena.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
  const log = document.getElementById('hostLog');
  const p = document.createElement('p');
  p.style.color = '#f1c40f';
  p.textContent = `🛡️ ${msg.teamName} 升起护盾（减免 ${msg.reduction}%）`;
  log.appendChild(p); log.scrollTop = log.scrollHeight;
}
function renderHostResolve(msg) {
  stopCountdown();
  // 重绘血条
  const row = document.getElementById('hostArena');
  if (row.querySelector('.host-team')) {
    row.querySelectorAll('.host-team').forEach(el => {
      const t = (msg.teams || []).find(x => x.idx === parseInt(el.dataset.team));
      if (t) {
        el.classList.toggle('dead', !t.alive);
        el.querySelector('.host-hp i').style.width = Math.max(0, t.hp / 300 * 100) + '%';
        el.querySelector('.host-hp span').textContent = t.hp;
      }
    });
    // 技能飞行 + 受击动画
    (msg.events || []).forEach(e => {
      const fromEl = row.querySelector(`.host-team[data-team="${e.fromTeam}"]`);
      const toEl = row.querySelector(`.host-team[data-team="${e.toTeam}"]`);
      if (fromEl && toEl) {
        flySkill(fromEl, toEl, e.fromEmoji, e.fromColor, e.damage);
        toEl.classList.remove('hit'); void toEl.offsetWidth; toEl.classList.add('hit');
        fromEl.classList.remove('attacker'); void fromEl.offsetWidth; fromEl.classList.add('attacker');
      }
    });
  }
  renderHostLog(msg.log || []);
}
function renderHostLog(log) {
  const el = document.getElementById('hostLog');
  el.innerHTML = (log || []).map(l =>
    `<p style="color:${l.type==='hero'?'#5dade2':l.type==='bad'?'#ec7063':l.type==='skill'?'#bb8fce':'#f7dc6f'}">${l.text}</p>`).join('');
  el.scrollTop = el.scrollHeight;
}

// ===== 特效：技能飞行 =====
function flySkill(fromEl, toEl, emoji, color, dmg) {
  const arena = document.getElementById('hostArena');
  const arenaRect = arena.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly-emoji'; f.textContent = emoji;
  const s = fromEl.getBoundingClientRect();
  f.style.left = (s.left - arenaRect.left + s.width / 2 - 20) + 'px';
  f.style.top = (s.top - arenaRect.top + s.height / 2 - 20) + 'px';
  arena.appendChild(f);
  const d = document.createElement('div');
  d.className = 'dmg-num'; d.textContent = '-' + dmg;
  const t = toEl.getBoundingClientRect();
  d.style.left = (t.left - arenaRect.left + t.width / 2 - 20) + 'px';
  d.style.top = (t.top - arenaRect.top + 4) + 'px';
  arena.appendChild(d);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const e = toEl.getBoundingClientRect();
      f.style.transition = 'left .6s ease-in, top .6s ease-in, transform .6s ease-in';
      f.style.left = (e.left - arenaRect.left + e.width / 2 - 20) + 'px';
      f.style.top = (e.top - arenaRect.top + e.height / 2 - 20) + 'px';
      f.style.transform = 'scale(1.6)';
    });
  });
  setTimeout(() => { f.remove(); d.remove(); }, 900);
}

// ===== 结算 =====
function showResult(msg) {
  show('resultPanel');
  confetti();
  const ranks = msg.ranking;
  document.getElementById('championText').textContent = `👑 ${ranks[0].name} 获得总冠军！`;
  const box = document.getElementById('finalRanks');
  box.innerHTML = '<p style="text-align:center;color:#ffd700;margin:10px 0">🏆 全场前五名</p>';
  ranks.slice(0, 5).forEach((r, i) => {
    const medal = ['🥇','🥈','🥉','4️⃣','5️⃣'][i];
    const div = document.createElement('div');
    div.className = 'rank-item r' + (i + 1);
    div.innerHTML = `
      <div class="rank-medal">${medal}</div>
      <div class="rank-avatar">${r.photo?`<img src="${r.photo}">`:'❓'}</div>
      <div class="rank-info">
        <div class="rn">${esc(r.name)}</div>
        <div class="rd">${r.teamName} · ${r.skill.emoji}${r.skill.name} · 答对${r.correct}/${r.total}</div>
      </div>
      <div class="rank-score">${r.score}</div>`;
    box.appendChild(div);
  });
  document.getElementById('replayBtn').style.display = isHost ? 'inline-block' : 'none';
}
function renderStats(stats) {
  const sec = document.getElementById('statsSection');
  const bad = stats.filter(s => s.wrong > 0);
  sec.style.display = 'block';
  if (!bad.length) { sec.innerHTML = '<div class="stat-block"><b>📊 错题回顾</b><div class="stat-none">本局全员全对，无错题 🎉</div></div>'; return; }
  let html = '<div class="stat-block"><b>📊 错题回顾（按答错次数排序）</b>';
  bad.slice(0, 10).forEach(s => {
    const wrongOpts = s.wrongList.length
      ? s.wrongList.map(w => `<span class="stat-opt">选项${String.fromCharCode(65 + w.idx)} 错选${w.count}次</span>`).join('')
      : '';
    html += `<div class="stat-item">
      <div class="stat-q">第${s.qNum}题 · 答错 <b style="color:#e74c3c">${s.wrong}</b> 次（答对${s.correct}/${s.asked}）</div>
      <div class="stat-t">${esc(s.q)}</div>
      ${wrongOpts?`<div class="stat-opts">${wrongOpts}</div>`:''}
    </div>`;
  });
  html += '</div>';
  sec.innerHTML = html;
}
function confetti() {
  const colors = ['#ffd700','#ff6b6b','#2ecc71','#3498db','#ff7f50','#9b59b6'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (Math.random() * 2 + 2) + 's';
    c.style.animationDelay = Math.random() * 1.2 + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// ===== 工具 =====
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===== 启动 =====
connect();
</script>
